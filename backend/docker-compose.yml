services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
  api:
    build: .
    restart: unless-stopped
    depends_on: [mongo]
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development          # set to production behind HTTPS
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/support_tickets
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ chars)}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
volumes:
  mongo-data:
